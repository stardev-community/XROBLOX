<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StarDevXroblox</title>
<meta name="description" content="Bangun script Roblox berbasis LuluUI tanpa menulis Lua. Hasil: satu file .lua.">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><b>StarDevXroblox</b><small id="ver"></small></div>
  <div class="top-actions">
    <button class="btn ghost" id="b-undo" title="Urungkan (Ctrl+Z)">←</button>
    <button class="btn ghost" id="b-redo" title="Ulangi (Ctrl+Y)">→</button>
    <button class="btn ghost" id="b-mode" title="Mode tampilan">Mode: Mudah</button>
    <button class="btn ghost" id="b-theme" title="Terang/Gelap">Tema</button>
    <button class="btn primary" id="b-gen">Hasilkan ▸</button>
  </div>
</header>
<nav class="steps" id="steps"></nav>
<main id="view"></main>
<div id="toasts"></div>
<div id="modal-root"></div>
<footer class="foot"></footer>
<script src="js/core.js"></script>
<script src="js/themes.js"></script>
<script src="js/luacheck.js"></script>
<script src="js/runtime.js"></script>
<script src="js/generator.js"></script>
<script src="js/validate.js"></script>
<script src="js/templates.js"></script>
<script src="js/ui/dom.js"></script>
<script src="js/ui/editors.js"></script>
<script src="js/ui/tools.js"></script>
<script src="js/ui/views.js"></script>
<script src="js/ui/uibuilder.js"></script>
<script src="js/ui/result.js"></script>
<script src="js/app.js"></script>
</body>
</html>
